services:
  app:
    build:
      context: .
      target: runtime
    env_file:
      - .env.example
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-local_docker_paystack_key}
    ports:
      - '${HOST_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: runtime
    command: node dist/worker
    env_file:
      - .env.example
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-local_docker_paystack_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - workers

  migrations:
    build:
      context: .
      target: development
    command: npm run migration:run
    env_file:
      - .env.example
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-local_docker_paystack_key}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  tests:
    build:
      context: .
      target: development
    command: npm run test
    env_file:
      - .env.example
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-local_docker_paystack_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - tools

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-bumpa}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-bumpa}
      POSTGRES_DB: ${DATABASE_NAME:-bumpa_ecommerce}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER:-bumpa} -d ${DATABASE_NAME:-bumpa_ecommerce}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
