services:
  app:
    build:
      context: .
      target: development
    command: npm run start:dev
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-bumpa}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-bumpa}
      POSTGRES_DB: ${DATABASE_NAME:-bumpa_ecommerce}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-bumpa} -d ${DATABASE_NAME:-bumpa_ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
